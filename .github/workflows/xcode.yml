name: Xcode - Build and Analyze

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  xcode:
    name: Build & Verify iOS Runner (Xcode)
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS Simulator app (no codesign)
        run: flutter build ios --simulator --debug --no-codesign

      - name: Verify Xcode build settings & compiled Runner.app bundle
        run: |
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            -showBuildSettings > /dev/null
          test -d build/ios/iphonesimulator/Runner.app
          /usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" build/ios/iphonesimulator/Runner.app/Info.plist
          /usr/libexec/PlistBuddy -c "Print :NSFaceIDUsageDescription" build/ios/iphonesimulator/Runner.app/Info.plist
