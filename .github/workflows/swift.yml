name: Swift

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  swift:
    name: Validate Swift Sources & Flutter Swift Package
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Swift toolchain version
        run: swift --version

      - name: Parse & syntax-check iOS Swift sources
        run: |
          xcrun swiftc -parse \
            ios/Runner/AppDelegate.swift \
            ios/Runner/SceneDelegate.swift \
            ios/RunnerTests/RunnerTests.swift

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dart & iOS plugin dependencies
        run: |
          flutter pub get
          flutter build ios --config-only --no-codesign

      - name: Verify generated Flutter Swift Package manifest
        run: |
          if [ -f "ios/Flutter/ephemeral/Packages/FlutterGeneratedPluginSwiftPackage/Package.swift" ]; then
            swift package --package-path ios/Flutter/ephemeral/Packages/FlutterGeneratedPluginSwiftPackage dump-package > /dev/null
          fi
