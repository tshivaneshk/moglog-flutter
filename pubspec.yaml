name: moglog_flutter
description: "Moglog - Clean, private drama & TV tracker"
publish_to: 'none'
version: 3.1.1+19

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  sqlite3: ^2.7.5
  sqlcipher_flutter_libs: ^0.6.8
  path_provider: ^2.1.5
  path: ^1.9.1
  shared_preferences: ^2.5.2
  flutter_secure_storage: ^11.2.0
  cryptography: ^2.7.0
  crypto: ^3.0.6
  dio: ^5.8.0+1
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  image: ^4.5.3
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1
  cloud_firestore: ^5.6.5
  firebase_app_check: ^0.3.2+4
  google_sign_in: ^6.2.2
  local_auth: ^2.3.0
  flutter_local_notifications: ^18.0.1
  connectivity_plus: ^6.1.3
  file_picker: ^13.4.1
  share_plus: ^13.0.0
  url_launcher: ^6.3.1
  image_picker: ^1.1.2
  lucide_icons_flutter: ^3.1.9
  permission_handler: ^11.4.0
  package_info_plus: ^10.0.0
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/app_logo.png
    - assets/images/app_logo2.png
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/inter_variable.ttf
